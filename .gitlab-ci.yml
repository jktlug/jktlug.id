# GitLab CI/CD for JKTLUG.id
#
# Strategy: Native Stack build (cached) + lightweight runtime Docker image
#
# Why native Stack instead of pure Docker build?
#   The Dockerfile uses BuildKit cache mounts (--mount=type=cache) which are
#   lost on every GitLab shared runner job because each job gets a fresh
#   Docker-in-Docker daemon. Native Stack caching via GitLab's cache mechanism
#   is much faster and more reliable.
#
# Pipeline overview:
#   build-site  →  test  →  pages (GitLab Pages)  →  docker-build (Registry)
#                                                    →  deploy-k3s (optional)

stages:
  - build
  - test
  - deploy
  - containerize
  - k3s-deploy

variables:
  # Shallow clone is sufficient for most builds
  GIT_DEPTH: 10
  # GitLab Container Registry image name
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  # Stack version matching the Dockerfile
  STACK_VERSION: "3.1.1"

# ============================================================================
# Cache template for Stack dependencies
# ============================================================================
# Keyed by lockfile + cabal file so the cache invalidates when deps change.
.stack-cache: &stack-cache
  key:
    files:
      - stack.yaml.lock
      - jktlug-website.cabal
    prefix: stack
  paths:
    - ~/.stack/
  policy: pull-push

# ============================================================================
# Job template for native Stack builds
# ============================================================================
.stack-build:
  image: debian:trixie
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        bash
        ca-certificates
        curl
        git
        gnupg
        pkg-config
        sudo
        zlib1g-dev
        libgmp-dev
        libffi-dev
        libncurses-dev
        make
        python3
        python3-pip
        build-essential
        dpkg-dev
    # Install Stack if not already present (debian:trixie may have an old one)
    - |
      if ! command -v stack &> /dev/null || ! stack --version | grep -q "$STACK_VERSION"; then
        echo "Installing Stack ${STACK_VERSION}..."
        curl -sSL https://get.haskellstack.org/ | sh -s - -d /usr/local/bin
      fi
    - stack --version

# ============================================================================
# Stage: build
# ============================================================================
build-site:
  extends: .stack-build
  stage: build
  tags: [docker]
  cache:
    <<: *stack-cache
  script:
    - stack setup --no-terminal
    - stack build --dependencies-only --no-terminal
    - stack build --no-terminal
    - stack exec site-compiler rebuild
  artifacts:
    paths:
      - _site/
    expire_in: 1 day

# ============================================================================
# Stage: test
# ============================================================================
run-tests:
  extends: .stack-build
  stage: test
  tags: [docker]
  cache:
    <<: *stack-cache
    policy: pull  # read-only: avoid cache churn from test jobs
  script:
    - stack build --test --no-terminal
  dependencies: []  # tests don't need the compiled site artifact
# ============================================================================
# Stage: deploy  (GitLab Pages)
# ============================================================================
# GitLab requires the job to be named "pages" and the artifact path to be
# "public/". The site becomes available at:
#   https://<namespace>.gitlab.io/<project-name>
pages:
  stage: deploy
  image: busybox
  tags: [docker]
  dependencies:
    - build-site
  script:
    - mv _site public
    # Optional: custom domain for Pages
    # - echo "JKTLUG.id" > public/CNAME
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Stage: containerize  (GitLab Container Registry)
# ============================================================================
# Builds a lightweight runtime image using the pre-built _site/ directory.
# This avoids re-running the full Haskell build inside Docker.
docker-build:
  stage: containerize
  image: docker:24
  tags: [docker]
  services:
    - docker:24-dind
  dependencies:
    - build-site
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        -f Dockerfile.runtime \
        -t "$IMAGE_NAME:$CI_COMMIT_SHA" \
        -t "$IMAGE_NAME:latest" \
        .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"
  rules:
    # disabled: GitLab Container Registry is not enabled on the local instance.
    # Re-enable by removing `when: never` once the registry is configured.
    - when: never

# ============================================================================
# Alternative: Full multi-stage Docker build (no native Stack)
# ============================================================================
# Use this if you want a single Dockerfile and don't mind slower cache-miss
# builds. Requires buildx for decent layer caching.
#
# docker-build-full:
#   stage: containerize
#   image: docker:24
#   services:
#     - docker:24-dind
#   variables:
#     DOCKER_DRIVER: overlay2
#     DOCKER_BUILDKIT: 1
#   before_script:
#     - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
#     - docker buildx create --use --name gitlab-builder || docker buildx use gitlab-builder
#   script:
#     - |
#       docker buildx build \
#         --cache-from type=registry,ref="$IMAGE_NAME/cache" \
#         --cache-to type=registry,ref="$IMAGE_NAME/cache",mode=max \
#         --push \
#         -t "$IMAGE_NAME:$CI_COMMIT_SHA" \
#         -t "$IMAGE_NAME:latest" \
#         .
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Stage: k3s-deploy  (LOCAL DEV — no registry needed)
# ============================================================================
# Builds the runtime image in dind, imports it directly into the host k3s
# containerd (no registry needed), and rolls out the dev deployment in
# namespace jktlug-dev. Same flow as bin/dev-deploy.sh.
#
# Runner requirements (already configured in the local runner's config.toml):
#   volumes     = ["...",
#                  "/run/k3s/containerd/containerd.sock:/run/k3s/containerd/containerd.sock",
#                  "/etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml:ro"]
#   extra_hosts = ["host.docker.internal:host-gateway"]
# Host firewall (one-time, on the k3s host):
#   sudo ufw allow from 172.16.0.0/12 to any port 6443 proto tcp

# Step 1: build the runtime image and export it as a tarball artifact.
# (Two-job design: the rancher/k3s image used below has ctr/kubectl but no
# docker CLI and no apk to install one, and no registry is enabled locally.)
docker-build-dev:
  stage: containerize
  image: docker:24
  tags: [docker]
  services:
    - docker:24-dind
  dependencies:
    - build-site
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
    DEV_IMAGE: docker.io/library/jktlug-website:dev
  script:
    - docker build -f Dockerfile.runtime -t "$DEV_IMAGE" .
    - docker save -o image.tar "$DEV_IMAGE"
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Step 2: import the tarball into the host k3s containerd and roll out.
deploy-k3s-dev:
  stage: k3s-deploy
  image:
    name: rancher/k3s:v1.31.5-k3s1   # /bin/ctr and /bin/kubectl are symlinks to k3s
    entrypoint: [""]
  tags: [docker]
  dependencies:
    - docker-build-dev
  variables:
    DEV_NAMESPACE: jktlug-dev
    DEV_DEPLOYMENT: jktlug-website
  script:
    # Import the image into the host k3s containerd via the mounted socket.
    # NOTE: call ctr/kubectl directly (symlinks), NOT `k3s ctr` / `k3s kubectl`.
    - ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images import image.tar
    # Point kubectl at the host k3s API via the Docker host gateway.
    # CA data is dropped and TLS verification skipped: the k3s server cert
    # has no SAN for the gateway IP. Client-cert auth is kept.
    - |
      cp /etc/rancher/k3s/k3s.yaml /tmp/kubeconfig
      sed -i -e 's#https://127.0.0.1:6443#https://host.docker.internal:6443#' \
             -e '/certificate-authority-data/d' /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl --insecure-skip-tls-verify rollout restart "deployment/$DEV_DEPLOYMENT" -n "$DEV_NAMESPACE"
    - kubectl --insecure-skip-tls-verify rollout status "deployment/$DEV_DEPLOYMENT" -n "$DEV_NAMESPACE" --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Stage: k3s-deploy  (PRODUCTION, via GitLab Container Registry)
# ============================================================================
# Requires:
#   - GitLab Container Registry enabled on this instance (NOT enabled locally,
#     so this job is disabled: `when: never`)
#   - A GitLab CI/CD variable KUBECONFIG (file type) containing the kubeconfig
#   - Or a runner with kubectl and a pre-configured kubeconfig
#
# This job is set to manual trigger for safety. Remove "when: manual" to auto-deploy.
deploy-k3s:
  stage: k3s-deploy
  image: bitnami/kubectl:latest
  tags: [docker]
  dependencies: []
  variables:
    DEPLOYMENT_NAMESPACE: jktlug
    DEPLOYMENT_NAME: jktlug-website
    CONTAINER_NAME: nginx
  before_script:
    - kubectl version --client
  script:
    - |
      kubectl set image deployment/$DEPLOYMENT_NAME \
        $CONTAINER_NAME="$IMAGE_NAME:$CI_COMMIT_SHA" \
        --namespace "$DEPLOYMENT_NAMESPACE"
    - |
      kubectl rollout status deployment/$DEPLOYMENT_NAME \
        --namespace "$DEPLOYMENT_NAMESPACE" \
        --timeout=120s
  rules:
    - when: never  # disabled: GitLab Container Registry not enabled on local instance

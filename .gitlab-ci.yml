# GitLab CI/CD for JKTLUG.id
#
# Strategy: Native Stack build (persistent ~/.stack on the shell runner) +
# lightweight runtime Docker image
#
# Why native Stack instead of pure Docker build?
#   The Dockerfile uses BuildKit cache mounts (--mount=type=cache) which are
#   lost on every Docker-in-Docker job because each job gets a fresh daemon.
#   Native Stack builds on the shell runner keep ~/.stack on the host disk,
#   so dependency compilation persists between pipelines for free.
#
# Pipeline overview (branch-based):
#   push to dev  → build-site → test → docker-build-dev → deploy-k3s-dev (local k3s)
#   push to main → build-site → test → pages (GitLab Pages)
#                                  → docker-build → deploy-k3s (release, manual)

stages:
  - build
  - test
  - deploy
  - containerize
  - k3s-deploy

variables:
  # Shallow clone is sufficient for most builds
  GIT_DEPTH: 10
  # GitLab Container Registry image name
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  # Stack version matching the Dockerfile
  STACK_VERSION: "3.11.1"

# ============================================================================
# Job template for native Stack builds
# ============================================================================
# Note: no GitLab `cache:` for ~/.stack — these jobs run on the shell executor,
# so ~/.stack persists on the host disk between jobs. The cache mechanism
# (compress/upload/download/decompress) would be pure overhead here.
.stack-build:
  image: debian:13
  before_script:
    # Install Stack if not already present (debian:13 may have an old one)
    - |
      if ! command -v stack &> /dev/null || ! stack --version | grep -q "$STACK_VERSION"; then
        echo "Installing Stack ${STACK_VERSION}..."
        curl -sSL https://get.haskellstack.org/ | sh -s - -d /usr/local/bin
      fi
    - stack --version

# ============================================================================
# Stage: build
# ============================================================================
build-site:
  extends: .stack-build
  stage: build
  tags: [shell]
  script:
    - stack setup --no-terminal
    - stack build --dependencies-only --no-terminal
    - stack build --no-terminal
    - stack exec site-compiler rebuild
  artifacts:
    paths:
      - _site/
    expire_in: 1 day

# ============================================================================
# Stage: test
# ============================================================================
run-tests:
  extends: .stack-build
  stage: test
  tags: [shell]
  script:
    - stack build --test --no-terminal
  dependencies: []  # tests don't need the compiled site artifact
# ============================================================================
# Stage: deploy  (GitLab Pages)
# ============================================================================
# GitLab requires the job to be named "pages" and the artifact path to be
# "public/". The site becomes available at:
#   https://<namespace>.gitlab.io/<project-name>
pages:
  stage: deploy
  image: busybox
  tags: [docker]
  dependencies:
    - build-site
  script:
    - mv _site public
    # Optional: custom domain for Pages
    # - echo "JKTLUG.id" > public/CNAME
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Stage: containerize  (GitLab Container Registry)
# ============================================================================
# Builds a lightweight runtime image using the pre-built _site/ directory.
# This avoids re-running the full Haskell build inside Docker.
docker-build:
  stage: containerize
  image: docker:24
  tags: [docker]
  services:
    - docker:24-dind
  dependencies:
    - build-site
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
    DOCKER_TLS_CERTDIR: ""
    DOCKERHUB_IMAGE: adipginting/jktlug-website
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -f Dockerfile.runtime -t "$DOCKERHUB_IMAGE:$CI_COMMIT_SHA" .
    - docker build -f Dockerfile.runtime -t "$DOCKERHUB_IMAGE:latest" .
    - docker push "$DOCKERHUB_IMAGE:$CI_COMMIT_SHA"
    - docker push "$DOCKERHUB_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Alternative: Full multi-stage Docker build (no native Stack)
# ============================================================================
# Use this if you want a single Dockerfile and don't mind slower cache-miss
# builds. Requires buildx for decent layer caching.
#
# docker-build-full:
#   stage: containerize
#   image: docker:24
#   services:
#     - docker:24-dind
#   variables:
#     DOCKER_DRIVER: overlay2
#     DOCKER_BUILDKIT: 1

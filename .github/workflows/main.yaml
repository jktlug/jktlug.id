# GitHub Actions CI/CD for jktlug.id
#
# Mirrors .gitlab-ci.yml, but deploys ONLY to the remote (production) k3s —
# there is no local-dev deploy here (that lives in GitLab, on the dev branch).
#
# Pipeline:
#   build-site → test → push-image → deploy-k3s
#
# GitHub Organization:
#
# Variables:
#   DOCKERHUB_USERNAME
#
# Secrets:
#   DOCKERHUB_TOKEN
#   KUBECONFIG (base64-encoded kubeconfig of the REMOTE k3s cluster)
#
# GitHub Pages:
#   Settings → Pages → Source: GitHub Actions

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  STACK_VERSION: "3.11.1"
  STACK_ROOT: /root/.stack
  
permissions:
  contents: read

jobs:

  # --------------------------------------------------------------------------
  # Build the static site
  # --------------------------------------------------------------------------
  build-site:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git pkg-config \
            zlib1g-dev libgmp-dev libffi-dev libncurses-dev \
            make build-essential dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: /root/.stack
          key: stack-${{ hashFiles('stack.yaml.lock', 'jktlug-website.cabal') }}
          restore-keys: |
            stack-

      - name: Install Stack
        run: |
          if ! command -v stack >/dev/null 2>&1 || ! stack --version | grep -q "$STACK_VERSION"; then
            echo "Installing Stack ${STACK_VERSION}..."

            curl -sSL \
              https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64.tar.gz \
              | tar xz \
                --wildcards \
                --strip-components=1 \
                -C /usr/local/bin \
                '*/stack'
          fi

          stack --version

      - name: Build site
        run: |
          stack setup --no-terminal --allow-different-user
      
          stack build --dependencies-only \
            --no-terminal \
            --allow-different-user
      
          stack build \
            --no-terminal \
            --allow-different-user
      
          stack exec site-compiler rebuild

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site/
          retention-days: 1


  # --------------------------------------------------------------------------
  # Test suite
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git pkg-config \
            zlib1g-dev libgmp-dev libffi-dev libncurses-dev \
            make build-essential dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: /root/.stack
          key: stack-${{ hashFiles('stack.yaml.lock', 'jktlug-website.cabal') }}
          restore-keys: |
            stack-

      - name: Install Stack
        run: |
          if ! command -v stack >/dev/null 2>&1 || ! stack --version | grep -q "$STACK_VERSION"; then
            echo "Installing Stack ${STACK_VERSION}..."

            curl -sSL \
              https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64.tar.gz \
              | tar xz \
                --wildcards \
                --strip-components=1 \
                -C /usr/local/bin \
                '*/stack'
          fi

          stack --version

      - name: Run tests
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
      
            if stack build --test --no-terminal --allow-different-user; then
              exit 0
            fi
      
            echo "Stack build failed. Waiting before retry..."
            sleep 15
          done
      
          exit 1


  # --------------------------------------------------------------------------
  # Build and push production Docker image
  #
  # Uses the already-built static site artifact.
  # No Haskell build happens inside Docker.
  # --------------------------------------------------------------------------
  push-image:
    needs: [build-site, test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/jktlug.id

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: _site

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # --------------------------------------------------------------------------
  # Deploy production image to remote K3s
  #
  # Runs automatically after push-image succeeds.
  # --------------------------------------------------------------------------
  deploy-k3s:
    needs: push-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/jktlug.id

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube

          echo "${{ secrets.KUBECONFIG }}" \
            | base64 -d > ~/.kube/config

          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info

      - name: Update deployment image
        run: |
          kubectl set image \
            deployment/jktlug-website \
            nginx=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace jktlug

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/jktlug-website \
            --namespace jktlug \
            --timeout=120s
# GitHub Actions CI/CD for jktlug.id
#
# Mirrors .gitlab-ci.yml, but deploys ONLY to the remote (production) k3s —
# there is no local-dev deploy here (that lives in GitLab, on the dev branch).
#
# Pipeline overview (push to main → straight to production):
#   build-site → test → deploy-pages (GitHub Pages)
#                     → push-image (Docker Hub) → deploy-k3s (remote k3s prod)
#
# Required repo settings:
#   Secrets:  DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  (Docker Hub access token)
#             KUBECONFIG  (base64-encoded kubeconfig of the REMOTE k3s cluster)
#   Settings → Pages → Source: "GitHub Actions"

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  STACK_VERSION: "3.11.1"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Build the static site natively with Stack inside an Ubuntu 24.04
  # container (same distro family as the runner). ~/.stack is cached via
  # actions/cache.
  # --------------------------------------------------------------------------
  build-site:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git pkg-config \
            zlib1g-dev libgmp-dev libffi-dev libncurses-dev \
            make build-essential dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ hashFiles('stack.yaml.lock', 'jktlug-website.cabal') }}
          restore-keys: stack-

      - name: Install Stack
        run: |
          # Direct binary tarball (same as the Dockerfile) — no installer
          # script, so no extra apt dependencies like gnupg/netbase.
          if ! command -v stack >/dev/null 2>&1 || ! stack --version | grep -q "$STACK_VERSION"; then
            echo "Installing Stack ${STACK_VERSION}..."
            curl -sSL https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64.tar.gz \
              | tar xz --wildcards --strip-components=1 -C /usr/local/bin '*/stack'
          fi
          stack --version

      - name: Build site
        run: |
          stack setup --no-terminal
          stack build --dependencies-only --no-terminal
          stack build --no-terminal
          stack exec site-compiler rebuild

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site/
          retention-days: 1

  # --------------------------------------------------------------------------
  # Test suite (Hakyll unit tests via HTF)
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git pkg-config \
            zlib1g-dev libgmp-dev libffi-dev libncurses-dev \
            make build-essential dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ hashFiles('stack.yaml.lock', 'jktlug-website.cabal') }}
          restore-keys: stack-

      - name: Install Stack
        run: |
          # Direct binary tarball (same as the Dockerfile) — no installer
          # script, so no extra apt dependencies like gnupg/netbase.
          if ! command -v stack >/dev/null 2>&1 || ! stack --version | grep -q "$STACK_VERSION"; then
            curl -sSL https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64.tar.gz \
              | tar xz --wildcards --strip-components=1 -C /usr/local/bin '*/stack'
          fi
          stack --version

      - name: Run tests
        run: stack build --test --no-terminal

  # --------------------------------------------------------------------------
  # Deploy static site to GitHub Pages
  # NOTE: Settings → Pages → "Build and deployment" source = "GitHub Actions".
  # --------------------------------------------------------------------------
  deploy-pages:
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: _site

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------------
  # Build and push the production image to Docker Hub
  # (uses the pre-built _site/ artifact — no Haskell rebuild inside Docker)
  # --------------------------------------------------------------------------
  push-image:
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context is not allowed in workflow-level `env`,
    # so the image name is defined per-job. Repo: <dockerhub-user>/jktlug.id
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/jktlug.id
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: _site

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Deploy to the REMOTE k3s cluster (production namespace: jktlug).
  # Runs automatically on every push to main — no manual gate.
  #
  # NOTE: if the Docker Hub repo is private, the cluster needs a pull secret:
  #   kubectl create secret docker-registry dockerhub-pull-secret -n jktlug \
  #     --docker-server=index.docker.io --docker-username=... --docker-password=...
  # and `imagePullSecrets` in k3s/deployment.yaml. Public repos need nothing.
  # --------------------------------------------------------------------------
  deploy-k3s:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/jktlug.id
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/jktlug-website \
            nginx=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace jktlug

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jktlug-website \
            --namespace jktlug \
            --timeout=120s

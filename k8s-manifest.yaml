apiVersion: apps/v1
kind: Deployment
metadata:
  name: jktlug-website
  labels:
    app: jktlug-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jktlug-website
  template:
    metadata:
      labels:
        app: jktlug-website
    spec:
      containers:
        - name: nginx
          image: jktlug-website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jktlug-website
spec:
  selector:
    app: jktlug-website
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
# Optional: Traefik IngressRoute for k3s
# Remove this if you use a LoadBalancer Service or host-level proxy instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jktlug-website
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jktlug.id`) || Host(`www.jktlug.id`)
      kind: Rule
      services:
        - name: jktlug-website
          port: 80

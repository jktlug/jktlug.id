server {
    listen       8080;
    server_name  localhost JKTLUG.id www.JKTLUG.id;

    root   /var/www/html;
    index  index.html;

    # ------------------------------------------------------------------
    # Wiki support: emulate MediaWiki behavior
    # ------------------------------------------------------------------

    # Redirect /wiki (no trailing slash) to the main wiki page
    location = /wiki {
        return 301 /wiki/Main_Page.html;
    }

    # Allow extensionless wiki URLs (e.g. /wiki/JKTLUG:Organization)
    location ~ ^/wiki/ {
        add_header Content-Type "text/html; charset=utf-8" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # ------------------------------------------------------------------
    # General static assets
    # ------------------------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /var/www/html;
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jktlug-website
  namespace: jktlug
  labels:
    app.kubernetes.io/name: jktlug-website
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jktlug-website
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jktlug-website
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: web
    spec:
      # If your GHCR image is private, create a pull secret first:
      # kubectl create secret docker-registry ghcr-pull-secret \
      #   --namespace jktlug \
      #   --docker-server=ghcr.io \
      #   --docker-username=<GITHUB_USERNAME> \
      #   --docker-password=<GITHUB_PERSONAL_ACCESS_TOKEN>
      # imagePullSecrets:
      #   - name: ghcr-pull-secret

      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          # Pin to a specific commit SHA in production instead of :latest.
          # GitHub Actions pushes tags: latest and <git-sha>.
          image: adipginting/jktlug-website:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: logs
              mountPath: /var/log/nginx
            - name: lib
              mountPath: /var/lib/nginx
            - name: run
              mountPath: /run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: lib
          emptyDir: {}
        - name: run
          emptyDir: {}

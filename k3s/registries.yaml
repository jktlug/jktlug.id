# k3s containerd registry configuration
# Place this file at /etc/rancher/k3s/registries.yaml on every node,
# then restart k3s: sudo systemctl restart k3s
#
# This tells k3s how to authenticate with the private registry at
# registry.JKTLUG.id. Update the username/password to match your
# Caddyfile basic auth credentials.
configs:
  "registry.JKTLUG.id":
    auth:
      username: jktlug
      password: changeme
    tls:
      # Caddy uses valid Let's Encrypt certificates by default,
      # so we do not need custom CA files. If you use a self-signed
      # certificate, set insecure_skip_verify: true below.
      cert_file: ""
      key_file: ""
      ca_file: ""
      insecure_skip_verify: false
